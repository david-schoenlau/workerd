# david-schoenlau build: the Executor fork of workerd for linux-arm64 WITHOUT tcmalloc, so it runs
# on Raspberry Pi kernels built with 39-bit virtual addresses (cloudflare/workerd#5020). Based on
# tag v1.20260918.1-executor.caf569c512 (the runtime in executor-selfhost:2.0.0-beta.37). Changes
# from upstream: linux-64 row dropped, use_tcmalloc=False added, release job removed — the binary
# is taken from the workerd-linux-arm64 run artifact.
name: Executor workerd release

on:
  push:
    branches:
      - 'executor/**'
    paths-ignore:
      - 'EXECUTOR.md'
  workflow_dispatch:
    inputs:
      from_run:
        description: 'Publish the binaries of this earlier run instead of building (run ID)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: executor-release-${{ github.ref }}-${{ inputs.from_run }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 matches upstream release builds (glibc 2.35).
          - arch: linux-arm64
            image: ubuntu-22.04-arm
    name: build (${{ matrix.arch }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.from_run == '' }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /
      # Computed once, before Setup Runner appends toolchain paths to .bazelrc, so that the key
      # used to save the cache matches the one used to restore it.
      - name: Cache key
        id: cache-key
        run: echo "prefix=executor-bazel-${{ matrix.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'build/deps/gen/*.bzl', 'build/deps/gen/*.bazel') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v5
        with:
          path: ~/bazel-disk-cache
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      - name: Setup Runner
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''
      - name: Bazel build
        id: build
        timeout-minutes: 320
        run: |
          # The disk cleanup removes the Android SDK the x64 image points ANDROID_HOME at;
          # rules_android fails to fetch when that variable names a missing SDK.
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME -u ANDROID_NDK_ROOT \
          bazel build --config=ci --config=ci-linux-common --config=release_linux --strip=always \
            --local_resources=memory=HOST_RAM*.8 \
            --//src/workerd/server:use_tcmalloc=False \
            //src/workerd/server:workerd
      - name: Smoke test
        if: steps.build.outcome == 'success'
        run: |
          cp bazel-bin/src/workerd/server/workerd /tmp/workerd
          /tmp/workerd --version
          bash .github/executor/smoke-test.sh /tmp/workerd
          # The point of this build: tcmalloc must not be linked in.
          if grep -qa 'TCMalloc assumes' /tmp/workerd; then echo "::error::tcmalloc still linked"; exit 1; fi
          sha256sum /tmp/workerd
      - name: Upload binary
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: workerd-${{ matrix.arch }}
          path: /tmp/workerd
          if-no-files-found: error
      - name: Trim Bazel disk cache
        if: always()
        run: |
          if [ -d ~/bazel-disk-cache ]; then
            find ~/bazel-disk-cache -size +100M -type f -delete
            du -ms ~/bazel-disk-cache
          fi
          bazel shutdown || true
      - name: Save Bazel disk cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/bazel-disk-cache
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}
